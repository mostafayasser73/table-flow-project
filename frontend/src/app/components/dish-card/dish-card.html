<article class="card">
  <a class="thumb" [routerLink]="['/menu', item()._id]">
    @if (item().imageUrl) {
      <img [src]="image()" [alt]="item().name" />
    }
  </a>

  <div class="card-body">
    <div class="card-top">
      <h2>
        <a [routerLink]="['/menu', item()._id]">{{ item().name }}</a>
      </h2>
      <span class="price">{{ item().price }} EGP</span>
    </div>

    <p class="description">{{ item().description }}</p>

    <div class="card-meta">
      <span class="badge">{{ item().category }}</span>
      <span>{{ item().preparationTime }}</span>
      @if (item().numReviews) {
        <span>{{ item().rating }} ({{ item().numReviews }})</span>
      }

      <!-- whatever the page puts inside <app-dish-card> lands here -->
      <ng-content />
    </div>

    <button
      type="button"
      class="add"
      [class.added]="justAdded()"
      (click)="addToCart.emit(item())"
    >
      {{ justAdded() ? 'Added' : 'Add to cart' }}
    </button>
  </div>
</article>
